<title>세라 생일 케이크</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Jua&display=swap">
<style>
  /* 한 화면짜리 무대: 초승달 밤하늘 아래 오층탑 정원, 벚꽃잎이 날리고 한가운데 케이크 */
  :root {
    --sky-top: #070a1f;
    --sky-mid: #191440;
    --sky-low: #3b2659;
    --ink: #fff6fb;
    --ink-soft: #d9cff0;
    --rose: #ff8fbf;
    --plum: #241433;
    --veil: rgba(10, 6, 22, 0.88);
    --font-pixel: "DotGothic16", "MS Gothic", ui-monospace, monospace;
    --font-round: "Jua", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
    background-color: var(--sky-top);
    color: var(--ink); font-family: var(--font-round);
  }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage.hot { cursor: pointer; }
  #stage:focus-visible { outline: 3px solid var(--rose); outline-offset: -6px; }
  .head {
    position: fixed; left: 0; right: 0; top: 0;
    padding-top: calc(env(safe-area-inset-top, 0px) + clamp(18px, 4vh, 40px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; justify-items: center; gap: 4px; pointer-events: none; text-align: center;
  }
  .eyebrow { font-family: var(--font-pixel); font-size: clamp(14px, 2.2vw, 18px); letter-spacing: 0.32em; color: var(--ink-soft); }
  .name { font-family: var(--font-pixel); font-size: clamp(48px, 11vw, 104px); line-height: 1; letter-spacing: 0.08em; color: var(--ink);
    text-shadow: 0 0 22px rgba(255, 143, 191, 0.55), 4px 4px 0 var(--plum); }
  .date { font-family: var(--font-pixel); font-size: clamp(13px, 1.8vw, 16px); letter-spacing: 0.2em; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .foot {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(18px, 4vh, 36px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; justify-items: center; gap: 10px; text-align: center; pointer-events: none;
  }
  .hint { font-size: clamp(17px, 2.6vw, 22px); color: var(--ink); text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); transition: opacity .4s; }
  .hint small { display: block; font-family: var(--font-pixel); font-size: 12px; letter-spacing: 0.24em; color: var(--ink-soft); margin-top: 4px; }
  .foot button { pointer-events: auto; }
  .ghost { font: inherit; font-size: 15px; color: var(--ink); background: rgba(36, 20, 51, 0.55); border: 1px solid rgba(255, 246, 251, 0.3); border-radius: 999px; padding: 8px 18px; cursor: pointer; }
  .ghost:hover { background: rgba(36, 20, 51, 0.8); }
  .ghost:focus-visible, .close:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
  .mv { position: fixed; inset: 0; background: var(--veil); display: grid; place-items: center;
    padding-top: calc(env(safe-area-inset-top, 0px) + 16px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    opacity: 0; transition: opacity .6s ease; }
  .mv.show { opacity: 1; }
  .frame { width: min(100%, 1100px, calc((100vh - 140px) * 16 / 9)); display: grid; gap: 12px; }
  .frame video { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; box-shadow: 0 0 0 1px rgba(255, 246, 251, 0.15), 0 20px 60px rgba(0, 0, 0, 0.5); }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .bar .t { font-family: var(--font-pixel); letter-spacing: 0.12em; font-size: 15px; color: var(--ink-soft); min-width: 0; }
  .close { font: inherit; font-size: 15px; color: var(--plum); background: var(--ink); border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; }
  .err { color: var(--rose); font-size: 14px; }
</style>

<canvas id="stage" tabindex="0" aria-label="밤 벚꽃 정원의 세라 생일 복셀 케이크. 누르거나 엔터를 치면 뮤직비디오가 나와요."></canvas>
<header class="head">
  <div class="eyebrow">HAPPY BIRTHDAY</div>
  <div class="name">SERA</div>
  <div class="date">2026 · 11 · 04</div>
</header>
<footer class="foot">
  <div class="hint" id="hint">케이크를 눌러 촛불을 꺼 주세요<small>TAP THE CAKE</small></div>
  <button class="ghost" id="direct" type="button">바로 뮤직비디오 보기</button>
</footer>
<div class="mv" id="mv" hidden role="dialog" aria-modal="true" aria-label="세라 고민중독 뮤직비디오">
  <div class="frame">
    <video id="video" controls playsinline preload="none" poster="poster.jpg"></video>
    <div class="bar">
      <span class="t">세라 × 고민중독 · cover by SERA</span>
      <span class="err" id="err" hidden></span>
      <button class="close" id="close" type="button">닫고 촛불 다시 켜기</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canvas = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  const touch = matchMedia("(pointer: coarse)").matches;   // 폰: 해상도·그림자를 낮춰 가볍게
  renderer.setPixelRatio(Math.min(devicePixelRatio, touch ? 1.5 : 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x1b1438, 90, 230);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 900);

  // 결정적 난수: 매번 같은 정원
  let seed = 20261104;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const R = (a, b) => a + (b - a) * rnd();

  // ---------------- 빛: 달빛 + 석등 + 촛불
  scene.add(new THREE.HemisphereLight(0x3d3478, 0x0b0a18, 0.42));
  const MOON_DIR = new THREE.Vector3(-0.74, 0.16, -0.64).normalize();   // 오층탑 뒤에 낮게
  const moonLight = new THREE.DirectionalLight(0xb9c6ff, 0.6);
  moonLight.position.copy(MOON_DIR).multiplyScalar(120);
  moonLight.castShadow = true;
  moonLight.shadow.mapSize.set(touch ? 1024 : 2048, touch ? 1024 : 2048);
  Object.assign(moonLight.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, near: 10, far: 300 });
  moonLight.shadow.bias = -0.0008;
  scene.add(moonLight);

  // ---------------- 복셀 수집
  const world = new Map(), glow = new Map();
  const key = (x, y, z) => `${x},${y},${z}`;
  const put = (x, y, z, c) => world.set(key(x, y, z), [x, y, z, c]);
  const lit = (x, y, z, c) => glow.set(key(x, y, z), [x, y, z, c]);
  const has = (x, y, z) => world.has(key(x, y, z));

  // 땅: 밤의 잔디 + 자갈길 + 연못
  const POND = { x: 26, z: 24, rx: 15, rz: 9 };
  const inPond = (x, z) => ((x - POND.x) / POND.rx) ** 2 + ((z - POND.z) / POND.rz) ** 2 <= 1;
  const onPath = (x, z) => (Math.abs(x + Math.sin(z * 0.08) * 3) <= 3 && z > 6) || (Math.abs(z + 2) <= 2.5 && x < -6 && x > -30);
  for (let x = -70; x <= 70; x++) for (let z = -70; z <= 70; z++) {
    const d = x * x + z * z;
    if (d > 70 * 70) continue;
    if (inPond(x, z)) { put(x, -2, z, 0x1a2140); continue; }
    if (onPath(x, z)) { put(x, 0, z, rnd() < 0.5 ? 0x6d6a78 : 0x5d5a68); continue; }
    const n = Math.sin(x * 0.3) * Math.cos(z * 0.25);
    put(x, 0, z, n > 0.3 ? 0x17282a : n > -0.2 ? 0x132326 : 0x101d21);
    if (rnd() < 0.012) put(x, 1, z, 0x1d3331);
  }
  // 연못 가장자리 돌
  for (let a = 0; a < Math.PI * 2; a += 0.11) {
    const x = Math.round(POND.x + Math.cos(a) * (POND.rx + 0.6)), z = Math.round(POND.z + Math.sin(a) * (POND.rz + 0.6));
    put(x, 1, z, rnd() < 0.5 ? 0x77737f : 0x5f5b68);
    if (rnd() < 0.3) put(x, 2, z, 0x6a6674);
  }

  // 붉은 다리(타이코바시) — 연못을 가로지른다
  for (let i = -11; i <= 11; i++) {
    const x = POND.x + i, h = Math.round(4 - (i * i) / 30);
    for (let w = -2; w <= 2; w++) put(x, h, POND.z + w, 0x5a3a2a);
    put(x, h + 1, POND.z - 3, 0xc8323f); put(x, h + 1, POND.z + 3, 0xc8323f);
    if (i % 4 === 0) { put(x, h + 2, POND.z - 3, 0xc8323f); put(x, h + 2, POND.z + 3, 0xc8323f); }
  }

  // 오층탑
  function pagoda(cx, cz) {
    const WOOD = 0x7a2430, WALL = 0xe9e2d8, ROOF = 0x2e3346, ROOF2 = 0x3b4157, GOLD = 0xd9b25a;
    for (let x = -9; x <= 9; x++) for (let z = -9; z <= 9; z++) for (let y = 1; y <= 2; y++) put(cx + x, y, cz + z, 0x6b6775);   // 기단
    let y = 3;
    for (let t = 0; t < 5; t++) {
      const s = 6 - t, h = t === 0 ? 5 : 4;
      for (let k = 0; k < h; k++, y++) for (let x = -s; x <= s; x++) for (let z = -s; z <= s; z++) {
        const edge = Math.abs(x) === s || Math.abs(z) === s;
        if (!edge) continue;
        const corner = Math.abs(x) === s && Math.abs(z) === s, mid = (Math.abs(x) === s && Math.abs(z) % 3 === 0) || (Math.abs(z) === s && Math.abs(x) % 3 === 0);
        put(cx + x, y, cz + z, corner || mid ? WOOD : WALL);
      }
      // 처마: 넓게 펼치고 모서리를 들어 올린다
      const e = s + 3;
      for (let x = -e; x <= e; x++) for (let z = -e; z <= e; z++) {
        const m = Math.max(Math.abs(x), Math.abs(z));
        if (m < s - 1) continue;
        const lift = (Math.abs(x) >= e - 1 && Math.abs(z) >= e - 1) ? 1 : 0;
        put(cx + x, y + lift, cz + z, (x + z) & 1 ? ROOF : ROOF2);
        if (m <= s) put(cx + x, y + 1, cz + z, ROOF);
      }
      // 처마 끝 풍경(빛)
      for (const [sx, sz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) lit(cx + sx * e, y, cz + sz * e, 0xffd27a);
      y += 2;
    }
    for (let k = 0; k < 9; k++) put(cx, y + k, cz, GOLD);            // 상륜
    for (const k of [2, 4, 6]) for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) put(cx + dx, y + k, cz + dz, GOLD);
    // 창의 불빛
    for (let t = 0; t < 2; t++) lit(cx, 5 + t * 6, cz + 6 - t, 0xffb86b);
  }
  pagoda(-50, -42);

  // 석등
  const lanterns = [[-7, 14], [7, 22], [-7, 32], [6, 40], [-22, 6], [12, -10]];
  function lantern(x, z) {
    const S = 0x8a8594, D = 0x6f6a7a;
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) put(x + a, 1, z + b, D);
    put(x, 2, z, S); put(x, 3, z, S);
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) put(x + a, 4, z + b, D);
    for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) put(x + a, 5, z + b, S);
    lit(x, 5, z, 0xffc46e); lit(x + 1, 5, z, 0xffb35c); lit(x - 1, 5, z, 0xffb35c); lit(x, 5, z + 1, 0xffb35c); lit(x, 5, z - 1, 0xffb35c);
    for (let a = -2; a <= 2; a++) for (let b = -2; b <= 2; b++) if (Math.abs(a) + Math.abs(b) < 4) put(x + a, 6, z + b, D);
    put(x, 7, z, S);
  }
  lanterns.forEach(([x, z]) => lantern(x, z));

  // 벚나무
  const PINKS = [0xffc4dd, 0xffb0cf, 0xf7d6e6, 0xff9cc2, 0xffd9ea];
  const canopies = [];
  function tree(x0, z0, size, weep) {
    const BARK = 0x2a1c22, BARK2 = 0x35242a;
    const branch = (x, y, z, dx, dy, dz, len, depth) => {
      for (let i = 0; i < len; i++) {
        x += dx; y += dy; z += dz;
        const r = depth === 0 && i < len * 0.7 ? 1 : 0;
        for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++) if (!r || Math.abs(a) + Math.abs(b) < 2) put(Math.round(x + a), Math.round(y), Math.round(z + b), (i + depth) & 1 ? BARK : BARK2);
        if (depth >= 1 && i > len * 0.5 && rnd() < 0.35) canopies.push([x, y, z, size * R(0.35, 0.5), weep]);
      }
      if (depth >= 3) { canopies.push([x, y, z, size * R(0.45, 0.6), weep]); return; }
      const n = depth === 0 ? 3 : 2 + (rnd() < 0.5 ? 1 : 0);
      for (let k = 0; k < n; k++) {
        const a = rnd() * Math.PI * 2, out = R(0.6, 0.9);
        branch(x, y, z, Math.cos(a) * out, R(weep ? 0.25 : 0.35, 0.7), Math.sin(a) * out, Math.max(3, Math.round(len * R(0.5, 0.7))), depth + 1);
      }
    };
    // 줄기는 살짝 휘어 오른다
    branch(x0, 0, z0, R(-0.25, 0.25), 1, R(-0.25, 0.25), Math.round(size * 1.5), 0);
  }
  const trees = [[26, -20, 6.5, 0], [-22, 16, 6, 1], [44, 8, 5.5, 0], [-52, -6, 6.5, 1], [4, -46, 6, 0], [-24, -58, 5, 0], [52, -36, 6, 1], [-46, 38, 5.5, 0], [-28, -30, 5, 1]];
  trees.forEach(([x, z, s, weep]) => tree(x, z, s, weep));
  for (const [cx, cy, cz, r, weep] of canopies) {
    for (let x = -r; x <= r; x++) for (let y = -r; y <= r; y++) for (let z = -r; z <= r; z++) {
      const n = 0.82 + 0.25 * Math.sin(x * 1.3 + cz) * Math.cos(z * 1.1 + cx) + 0.12 * Math.sin(y * 2.1);
      const d = (x * x + y * y * 1.6 + z * z) / (r * r);
      if (d > n || rnd() < 0.12) continue;
      put(Math.round(cx + x), Math.round(cy + y + 1), Math.round(cz + z), PINKS[(rnd() * PINKS.length) | 0]);
    }
    if (weep) for (let k = 0; k < r * 2.2; k++) {        // 수양벚꽃: 꽃 사슬이 늘어진다
      const a = rnd() * Math.PI * 2, d = r * R(0.6, 1.05), hx = Math.round(cx + Math.cos(a) * d), hz = Math.round(cz + Math.sin(a) * d);
      const L = Math.round(R(4, 10));
      for (let i = 0; i < L; i++) { const y = Math.round(cy - i); if (y < 2) break; put(hx, y, hz, PINKS[(rnd() * PINKS.length) | 0]); }
    }
  }
  // 떨어진 꽃잎이 쌓인 땅
  for (const [x, z, s] of trees) for (let k = 0; k < 180; k++) {
    const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * s * 2.2, px = Math.round(x + Math.cos(a) * d), pz = Math.round(z + Math.sin(a) * d);
    if (!inPond(px, pz) && has(px, 0, pz)) put(px, 0, pz, PINKS[(rnd() * 3) | 0]);
  }

  // 케이크 돌단
  for (let x = -15; x <= 15; x++) for (let z = -15; z <= 15; z++) { const d = x * x + z * z; if (d <= 225) { put(x, 1, z, d > 180 ? 0x7d7889 : 0x8f8a9b); if (d <= 190) put(x, 2, z, 0x9b96a8); } }

  function instanced(map, material, cast) {
    const list = [...map.values()];
    const m = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), material, list.length);
    const mtx = new THREE.Matrix4(), col = new THREE.Color();
    list.forEach(([x, y, z, c], i) => { mtx.makeTranslation(x, y + 0.5, z); m.setMatrixAt(i, mtx); m.setColorAt(i, col.setHex(c)); });
    m.castShadow = cast; m.receiveShadow = true;
    scene.add(m);
    return m;
  }
  instanced(world, new THREE.MeshLambertMaterial(), true);
  instanced(glow, new THREE.MeshBasicMaterial(), false);
  lanterns.forEach(([x, z], i) => { if (i < 4) { const L = new THREE.PointLight(0xffb35c, 1.1, 26, 2); L.position.set(x, 6, z); scene.add(L); } });

  // 연못 물: 달빛 반사
  const water = new THREE.Mesh(new THREE.CircleGeometry(1, 48), new THREE.MeshPhongMaterial({ color: 0x18204a, emissive: 0x0b0f2a, shininess: 90, specular: 0x8899ff, transparent: true, opacity: 0.88 }));
  water.scale.set(POND.rx, POND.rz, 1); water.rotation.x = -Math.PI / 2; water.position.set(POND.x, -0.6, POND.z); water.receiveShadow = true;
  scene.add(water);

  // ---------------- 케이크 (돌단 위)
  const CY = 3;
  const cv = new Map();
  const cput = (x, y, z, c) => cv.set(key(x, y, z), [x, y, z, c]);
  const C = { plate: 0xd9c9f5, rim: 0xf4f0ff, sponge: 0xf7a8c8, sponge2: 0xf39abf, cream: 0xfff4f8, lav: 0xcbb3ff, lav2: 0xbda3f5,
    pink: 0xffb7d5, berry: 0xe8345a, leaf: 0x58b35c, rose: 0xff6fa8, roseDark: 0xd94a86, ribbon: 0x9a6fe0, plum: 0x4b2a66 };
  function tier(r, y0, h, side, side2, stripeY) {
    for (let y = y0; y < y0 + h; y++) for (let x = -r; x <= r; x++) for (let z = -r; z <= r; z++) {
      const d = x * x + z * z; if (d > r * r) continue;
      const top = y === y0 + h - 1; if (!top && d < (r - 1.6) * (r - 1.6)) continue;
      let c = ((x + z + y) & 1) ? side : side2; if (y === stripeY || top) c = C.cream;
      cput(x, y, z, c);
    }
    for (let a = 0; a < 360; a += 7) {
      const rad = a * Math.PI / 180, x = Math.round(Math.cos(rad) * r), z = Math.round(Math.sin(rad) * r);
      if (x * x + z * z > r * r) continue;
      for (let k = 1; k <= 1 + ((a * 37) % 3); k++) cput(x, y0 + h - 1 - k, z, C.cream);
    }
  }
  for (let x = -13; x <= 13; x++) for (let z = -13; z <= 13; z++) { const d = x * x + z * z; if (d <= 169) cput(x, 0, z, d > 132 ? C.rim : C.plate); }
  tier(10, 1, 7, C.sponge, C.sponge2, 4); tier(7, 8, 6, C.lav, C.lav2, 10); tier(4, 14, 5, C.pink, C.sponge, -1);
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, cx = Math.round(Math.cos(a) * 8.6), cz = Math.round(Math.sin(a) * 8.6);
    for (let dx = 0; dx < 2; dx++) for (let dz = 0; dz < 2; dz++) { cput(cx + dx, 8, cz + dz, C.berry); cput(cx + dx, 9, cz + dz, C.berry); } cput(cx, 10, cz, C.leaf); }
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + 0.3, cx = Math.cos(a) * 7.6, cz = Math.sin(a) * 7.6;
    for (let dy = -1; dy <= 1; dy++) for (let t = -1; t <= 1; t++) cput(Math.round(cx - Math.sin(a) * t), 11 + dy, Math.round(cz + Math.cos(a) * t), (dy === 0 && t === 0) ? C.roseDark : C.rose); }

    smoke.forEach(s => { if (s.userData.t === undefined || s.material.opacity <= 0 && s.userData.t > 0) return; s.userData.t += dt; const u = s.userData.t; if (u < 0) return; s.position.y += dt * 4; s.position.x += Math.sin(u * 4 + s.id) * dt; s.material.opacity = Math.max(0, 0.6 - u * 0.4); });
    if (confetti.visible) {
      let alive = 0;
      cd.forEach((d, i) => { d.life += dt; d.v.y -= 30 * dt; d.v.multiplyScalar(0.985); d.p.addScaledVector(d.v, dt); if (d.p.y < 3.6) { d.p.y = 3.6; d.v.set(0, 0, 0); } if (d.life < 3.2) alive++;
        dummy.position.copy(d.p); dummy.rotation.set(d.life * 5 + i, d.life * 3, 0); dummy.scale.setScalar(Math.max(0, 1 - Math.max(0, d.life - 2.4) / 0.8)); dummy.updateMatrix(); confetti.setMatrixAt(i, dummy.matrix); });
      confetti.instanceMatrix.needsUpdate = true; if (!alive) confetti.visible = false;
    }
    // 꽃잎: 밤바람(서쪽→동쪽), 가끔 돌풍, 땅에 닿으면 나무 위에서 다시
    // 약한 밤바람 + 팔랑팔랑: 좌우로 흔들리며 내려오고, 흔들림의 끝에서 살짝 멈칫한다
    const wind = 0.45 + Math.sin(t * 0.21) * 0.3;
    for (let i = 0; i < PET; i++) {
      const p = pd[i];
      const sw = Math.sin(t * p.w + p.r * 3);
      p.y -= dt * p.vy * (0.55 + 0.45 * Math.abs(sw)); p.x += dt * (wind + sw * 0.9); p.z += dt * Math.cos(t * p.w * 0.7 + p.r) * 0.5;
      if (p.y < 0.3) spawn(p);
      dummy.position.set(p.x, p.y, p.z); dummy.rotation.set(1.1 + sw * 0.8, p.r + t * 0.3, sw * 0.6); dummy.scale.setScalar(p.s); dummy.updateMatrix(); petals.setMatrixAt(i, dummy.matrix);
    }
    if (PET) petals.instanceMatrix.needsUpdate = true;
    const bgWind = 2.2 + Math.sin(t * 0.23) * 1.2;
    for (let i = 0; i < BG; i++) {
      const p = bd[i];
      p.y -= dt * p.vy; p.x += dt * (bgWind + Math.sin(t * p.w + p.r) * 1.6); p.z += dt * Math.cos(t * 0.7 * p.w + p.r) * 1.2; p.r += dt * p.w * 2;
      if (p.y < 0.3 || p.x > 90) bgSpawn(p, false);
      dummy.position.set(p.x, p.y, p.z); dummy.rotation.set(p.r, p.r * 0.6, p.r * 0.3); dummy.scale.setScalar(p.s); dummy.updateMatrix(); bgPetals.setMatrixAt(i, dummy.matrix);
    }
    bgPetals.instanceMatrix.needsUpdate = true;
    water.material.emissiveIntensity = 0.9 + Math.sin(t * 0.8) * 0.1;
    fireworks(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
